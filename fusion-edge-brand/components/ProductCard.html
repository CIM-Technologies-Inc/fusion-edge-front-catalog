<!doctype html>
<html>
<head><meta charset="utf-8"><title>Product card — preview</title><link rel="stylesheet" href="../fusion-edge-tokens.css"><link rel="stylesheet" href="../fusion-edge-components.css"></head>
<body>
<div class="fe-row" style="gap:var(--space-8);align-items:flex-start;padding:var(--space-6)">
  <article class="fe-card">
    <div class="fe-card__media">
      <span class="fe-badge fe-badge--revit">Revit-ready</span>
      <svg width="150" height="70" viewBox="0 0 150 70" aria-hidden="true"><line x1="75" y1="0" x2="75" y2="32" stroke="var(--ink-muted)" stroke-width="1.5"/><rect x="10" y="32" width="130" height="14" rx="3" fill="var(--fusion-navy)"/><rect x="14" y="46" width="122" height="4" fill="var(--edge-green)"/></svg>
    </div>
    <div class="fe-card__body">
      <span class="fe-card__maker">Lumen Works</span>
      <h3 class="fe-card__name">Linear Pendant 1200</h3>
      <span class="fe-card__spec">W 1200 × D 80 × H 60 mm · 3 types</span>
    </div>
    <div class="fe-card__foot">
      <span class="fe-card__price">$420</span>
      <button class="fe-handle"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="2"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/><circle cx="15" cy="18" r="2"/></svg>Drag to Revit</button>
    </div>
  </article>
  <article class="fe-card fe-card--lifted">
    <div class="fe-card__media">
      <span class="fe-badge fe-badge--revit">Revit-ready</span>
      <svg width="120" height="80" viewBox="0 0 120 80" aria-hidden="true"><rect x="10" y="10" width="100" height="44" rx="4" fill="var(--fusion-navy)"/><rect x="18" y="54" width="8" height="22" fill="var(--ink-muted)"/><rect x="94" y="54" width="8" height="22" fill="var(--ink-muted)"/><rect x="10" y="10" width="100" height="6" rx="3" fill="var(--edge-green)"/></svg>
    </div>
    <div class="fe-card__body">
      <span class="fe-card__maker">Nordform</span>
      <h3 class="fe-card__name">Bench Seat Modular</h3>
      <span class="fe-card__spec">W 1600 × D 450 × H 440 mm · 5 types</span>
    </div>
    <div class="fe-card__foot">
      <span class="fe-card__price">$1,180</span>
      <button class="fe-handle" style="cursor:grabbing"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="2"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/><circle cx="15" cy="18" r="2"/></svg>Dragging…</button>
    </div>
  </article>
</div>
</body>
</html>
