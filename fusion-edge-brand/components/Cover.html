<!doctype html>

<title>Fusion Edge</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .navy { fill:var(--fusion-navy); }
  .deep { fill:var(--navy-deep); }
  .tint { fill:var(--brand-soft); }
  .green { fill:var(--edge-green); }
  .blk { rx:var(--radius-md); }
  .plus { fill:var(--edge-green); }
  .plus.cut { fill:var(--brand-soft); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:104px; line-height:.95; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-family:var(--font-mono); font-size:13px; line-height:20px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted); }
</style>
